	<style type="text/css">
	*{
		padding: 0;
		margin: 0;
	}

	img{
		vertical-align: bottom;
	}
	.typePicker table {
		background: #f7f7f7;
	}
	.typePicker td{
		padding: 0 5px 4px 6px;
		vertical-align: top;
	}
	.typePicker{
		width: 274px;
		border: solid 2px #777777;
	}

	.typePicker .value{
		border-bottom: solid 2px #777777;
		background-color: #f7f7f7;
		width: 100%;
		padding: 5px;
		box-sizing: border-box;
	}

	.value>span::before{
		content: "";
    	display: inline-block;
    	width: 21px;
    	height: 21px;
    	background-image: url('images/type_sprite.png');
    	vertical-align: bottom;
    	position: relative;
    	bottom: 2px;
	}
	.value>span.grass::before{
		background-position: 0 -21px;
	}
	.typePicker .button::after{
		content:"";
		display: inline-block;
		width: 55px;
		height: 45px;
		background-image: url('images/button_sprite.png');
		position: relative;
		vertical-align: bottom;
		cursor: pointer;
	}
	.typePicker .colorless::after{
		background-position: 0 0;
	}
	.typePicker .grass::after{
		background-position: 0 -45px;
	}
	.typePicker .fire::after{
		background-position: 0 -90px;
	}
	.typePicker .water::after{
		background-position: 0 -135px;
	}
	.typePicker .lightning::after{
		background-position: 0 -180px;
	}
	.typePicker .phychic::after{
		background-position: 0 -225px;
	}
	.typePicker .fighting::after{
		background-position: 0 -270px;
	}
	.typePicker .darkness::after{
		background-position: 0 -315px;
	}
	.typePicker .metal::after{
		background-position: 0 -360px;
	}
	.typePicker .colorless:hover:after{
		background-position: 55px 0;
	}
	.typePicker .grass:hover:after{
		background-position: 55px -45px;
	}
	.typePicker .fire:hover:after{
		background-position: 55px -90px;
	}
	.typePicker .water:hover:after{
		background-position: 55px -135px;
	}
	.typePicker .lightning:hover:after{
		background-position: 55px -180px;
	}
	.typePicker .phychic:hover:after{
		background-position: 55px -225px;
	}
	.typePicker .fighting:hover:after{
		background-position: 55px -270px;
	}
	.typePicker .darkness:hover:after{
		background-position: 55px -315px;
	}
	.typePicker .metal:hover:after{
		background-position: 55px -360px;
	}

	</style>
