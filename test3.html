<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <style type="text/css">
    .typeSelector{
        position: relative;
        display: inline-block;
        padding: 0px 17px 2px 5px;
        width: 27px;
        border: solid 1px #777777;
    }
    .typeSelector.active,
    .typeSelector:focus {
     
    }  
    .typeSelector .optList.hidden {
        max-height: 0;
        visibility: hidden;
    }
    .typeSelector {
    }

    .typeSelector .value {
        display: inline-block;
    
    }

    .typeSelector:after {
         content : "▼";
         position: absolute;
         background-color: #f0f0f0;
         background: linear-gradient(180deg, #f0f0f0, #dadada);
         color: #000;
         border: solid 1px #707070;
         margin-left: 5px;
      
    }
    .typeSelector .optList {
        position : absolute;
        top: 100%;
        left : 0;
        list-style: none;
        margin:0;
        padding: 0;
        min-width : 100%;
        box-sizing: border-box;
        border: 1px solid #707070;
    }
    .typeSelector .option {

    }

    .typeSelector .option:hover {
        background-color: #3393ff;

    }
    .typeSelector .option::before{
        content: "";
        display: inline-block;
        width: 21px;
        height: 21px;
        background: url('images/type_sprite.png') no-repeat;
        vertical-align: bottom;
        position: relative;
        bottom: 2px;
        margin-left: 4px;
    }
    
    .typeSelector .colorless::before{
        background:url('images/type_sprite.png') 0 0;
    }
    .typeSelector .grass::before{
        background:url('images/type_sprite.png') 0 -21px;
    }
    .typeSelector .fire::before{
        background:url('images/type_sprite.png')  0 -42px;
    }
    .typeSelector .watar::before{
        background:url('images/type_sprite.png')  0 -63px;
    }
    .typeSelector .lightning::before{
        background:url('images/type_sprite.png')  0 -84px;
    }
    .typeSelector .phychic::before{
        background:url('images/type_sprite.png')  0 -105px;
    }
    .typeSelector .fighting::before{
        background:url('images/type_sprite.png')  0 -126px;
    }
    .typeSelector .darkness::before{
        background:url('images/type_sprite.png')  0 -147px;
    }
    .typeSelector .metal::before{
        background:url('images/type_sprite.png')  0 -168px;
    }
    .typeSelector .value::before {
    content: "";
    display: inline-block;
    width: 21px;
    height: 21px;
    vertical-align: bottom;
    position: relative;
    bottom: 2px;
    }
    </style>
    <title>Document</title>
</head>
<body>
	<div class="typeSelector">
		<span class="value grass"></span>
		<ul class="optList">
			<li class="option colorless"></li>
			<li class="option grass"></li>
			<li class="option fire"></li>
			<li class="option watar"></li>
			<li class="option lightning"></li>
			<li class="option phychic"></li>
			<li class="option fighting"></li>
			<li class="option darkness"></li>
			<li class="option metal"></li>
		</ul>
	</div>
</body>
</html>
